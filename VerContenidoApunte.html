<!-- VerContenidoApunte.html -->
<div class="view-header">
    <button id="btn-back-category" class="icon-btn back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h2 id="ver-apunte-title">Ver Apunte</h2>
    <div class="header-actions">
        <button id="btn-copy-ver-apunte" class="secondary-btn">
            <i class="fa-regular fa-copy"></i> Copiar
        </button>
        <button id="btn-delete-ver-apunte" class="danger-btn">
            <i class="fa-solid fa-trash"></i>
        </button>
        <button id="btn-save-ver-apunte" class="primary-btn">
            <i class="fa-solid fa-check"></i> Guardar
        </button>
    </div>
</div>

<div class="apunte-editor">
    <input type="text" id="ver-apunte-title-input" class="glass-input apunte-title-input" placeholder="Título del apunte">
    <textarea id="ver-apunte-content-input" class="glass-input apunte-textarea" placeholder="Escribe aquí tu código..."></textarea>
</div>
