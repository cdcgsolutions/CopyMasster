<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyMaster</title>
    
    <!-- Favicon y Acceso Directo / App Icons -->
    <link rel="icon" type="image/png" href="CopyMasterSinFondo.png">
    <link rel="shortcut icon" href="CopyMasterSinFondo.png">
    <link rel="apple-touch-icon" href="CopyMasterSinFondo.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#0f111a">
    <meta name="msapplication-TileColor" content="#0f111a">
    <meta name="msapplication-TileImage" content="CopyMaster.png">
    <meta property="og:title" content="CopyMaster">
    <meta property="og:description" content="Tu bóveda personal de scripts en la nube.">
    <meta property="og:image" content="CopyMasterSinFondo.png">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Archivos Separados -->
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="ModalCreacionEdicionCategorias.css">
    <link rel="stylesheet" href="ModalCrearVerApuntes.css">
    <link rel="stylesheet" href="VerContenidoApunte.css">
    <link rel="stylesheet" href="ModalEliminar.css">
</head>
<body class="dark-theme">
    
    <div class="app-background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="header-left" id="user-profile-info">
                <img id="user-profile-img" src="" alt="Perfil" class="profile-img" style="display: none;">
                <div class="user-details">
                    <h1 id="user-profile-name">Cargando...</h1>
                    <p id="user-profile-email">Cargando perfil...</p>
                </div>
            </div>
            <div class="header-right">
                <button id="theme-toggle" class="icon-btn" title="Cambiar Tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button id="btn-logout" class="icon-btn" title="Cerrar Sesión">
                    <i class="fa-solid fa-right-from-bracket"></i> <span class="btn-text-long">Cerrar sesión</span>
                </button>
            </div>
        </header>

        <!-- VIEW 1: Dashboard (Categorías) -->
        <main id="dashboard-view" class="view active fade-in">
            <div class="view-header">
                <h2>Mis Categorías</h2>
                <div class="header-actions">
                    <div class="minimal-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-category-input" placeholder="Buscar categoría...">
                    </div>
                    <button id="btn-open-category-modal" class="primary-btn">
                        <i class="fa-solid fa-plus"></i> <span class="btn-text-long">Nueva Categoría</span><span class="btn-text-short">Categoría</span>
                    </button>
                </div>
            </div>

            <div id="categories-grid" class="grid-container">
                <!-- Las categorías se insertarán aquí dinámicamente -->
            </div>
            <div id="categories-pagination" class="mud-pagination-container"></div>
        </main>

        <!-- VIEW 2: Category (Lista de Notas) -->
        <main id="category-view" class="view fade-in" style="display: none;">
            <div class="view-header">
                <div class="view-header-left">
                    <button id="btn-back-dashboard" class="icon-btn back-btn">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <h2 id="current-category-title">Categoría</h2>
                </div>
                <div class="header-actions">
                    <div class="minimal-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-note-input" placeholder="Buscar apunte...">
                    </div>
                    <button id="btn-open-note-modal" class="primary-btn">
                        <i class="fa-solid fa-plus"></i> <span class="btn-text-long">Nuevo Apunte</span><span class="btn-text-short">Apunte</span>
                    </button>
                </div>
            </div>

            <div id="notes-grid" class="notes-grid">
                <!-- Las notas se insertarán aquí dinámicamente -->
            </div>
            <div id="notes-pagination" class="mud-pagination-container"></div>
        </main>

        <!-- VIEW 3: Ver Apunte -->
        <main id="view-apunte" class="view fade-in" style="display: none;">
            <!-- El contenido se inyectará aquí -->
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Desarrollado por <strong>DANIEL</strong></p>
        </footer>

    </div>

    <!-- Contenedores para modales inyectados por fetch -->
    <div id="modal-category-container"></div>
    <div id="modal-note-container"></div>
    <div id="modal-delete-container"></div>

    <div id="toast-container" class="toast-container"></div>

    <!-- Spinner Global Bloqueante -->
    <div id="global-spinner-overlay" class="global-spinner-overlay">
        <div class="spinner-content-box">
            <div class="modern-spinner">
                <div class="spinner-ring ring-1"></div>
                <div class="spinner-ring ring-2"></div>
                <div class="spinner-icon"><i id="global-spinner-icon" class="fa-solid fa-cloud-arrow-up"></i></div>
            </div>
            <h3 id="global-spinner-text">Guardando cambios...</h3>
            <p id="global-spinner-subtext" class="spinner-subtext">Por favor, no cierres esta ventana</p>
        </div>
    </div>

    <!-- JS Archivos Separados -->
    <script src="ModalCreacionEdicionCategorias.js"></script>
    <script src="ModalCrearVerApuntes.js"></script>
    <script src="VerContenidoApunte.js"></script>
    <script src="ModalEliminar.js"></script>
    <script type="module" src="home.js"></script>
</body>
</html>
