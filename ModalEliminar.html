<!-- ModalEliminar.html -->
<div id="modal-eliminar" class="modal fade-in">
    <div class="modal-content glass-panel delete-modal-content">
        <div class="modal-body">
            <div class="delete-warning-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="delete-modal-title" class="delete-modal-title">¿Eliminar?</h3>
            <p id="delete-modal-message" class="delete-modal-message">
                ¿Estás seguro de que deseas eliminar este elemento?
            </p>
            <div class="delete-modal-actions">
                <button id="btn-cancel-delete" class="secondary-btn">Cancelar</button>
                <button id="btn-confirm-delete" class="danger-btn">Sí, eliminar</button>
            </div>
        </div>
    </div>
</div>
