<!-- ModalCreacionEdicionCategorias.html -->
<div id="modal-category" class="modal fade-in">
    <div class="modal-content glass-panel">
        <div class="modal-header">
            <h3>Nueva Categoría</h3>
            <button id="btn-close-category-modal" class="icon-btn close-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="input-group">
                <label>Nombre</label>
                <input type="text" id="category-title-input" placeholder="Nombre de la categoría" class="glass-input">
            </div>
            <div class="input-group">
                <label>Icono</label>
                <div class="icon-input-wrapper">
                    <input type="text" id="category-icon-input" placeholder="Escriba Aqui..." class="glass-input" autocomplete="off">
                    <i id="icon-preview" class="fa-solid fa-folder"></i>
                </div>
                <div id="icon-dropdown" class="icon-dropdown" style="display: none;">
                    <!-- Grid de iconos inyectado por JS -->
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button id="btn-save-category" class="primary-btn">
                <i class="fa-solid fa-check"></i> <span class="btn-text-long">Guardar Categoría</span><span class="btn-text-short">Guardar</span>
            </button>
        </div>
    </div>
</div>
