<!-- ModalCreacionEdicionCategorias.html -->
<div id="modal-category" class="modal fade-in">
    <div class="modal-content glass-panel">
        <div class="modal-header">
            <h3>Nueva Categoría</h3>
            <button id="btn-close-category-modal" class="icon-btn close-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <input type="text" id="category-title-input" placeholder="Nombre de la categoría (ej. Mis Scripts)" class="glass-input">
        </div>
        <div class="modal-footer">
            <button id="btn-save-category" class="primary-btn">
                <i class="fa-solid fa-check"></i> Guardar Categoría
            </button>
        </div>
    </div>
</div>
