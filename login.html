<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CopyMaster</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos base y de login -->
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="dark-theme login-body">

    <!-- Elementos decorativos de fondo -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="login-container fade-in">
        <div class="login-card glass-panel">
            <div class="login-header">
                <div class="logo">
                    <i class="fa-solid fa-code"></i>
                </div>
                <h1>CopyMaster</h1>
                <p>Tu bóveda personal</p>
            </div>
            
            <div class="login-body-content">
                <button id="btn-login-google" class="google-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" class="google-logo">
                    <span>Continuar con Google</span>
                </button>
            </div>
            
            <div class="login-footer">
                <p>Guarda y organiza tus scripts en la nube.</p>
            </div>
        </div>
    </div>

    <!-- Scripts (type module para usar Firebase) -->
    <script type="module" src="login.js"></script>
</body>
</html>
